# Accessibility gate — runs axe-core against every prerendered page of the built
# site at a mobile and a desktop viewport, and fails on any serious or critical
# WCAG 2.1 AA violation.
#
# This workflow is what makes the claim on /accessibility true ("every change is
# checked… a change that introduces a serious or critical issue is blocked").
# If you remove this workflow, remove that sentence from the accessibility
# statement in the same change.
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scan needs a real browser (contrast and target-size can't be
      # measured without layout). Ubuntu runners ship Chrome, so nothing is
      # downloaded; this step just pins where it lives.
      - name: Locate Chrome
        run: echo "A11Y_CHROME_PATH=$(which google-chrome || which google-chrome-stable || which chromium-browser)" >> "$GITHUB_ENV"

      - name: Type check
        run: npm run check

      - name: Accessibility scan
        run: npm run a11y
